[project]
name = "rag-knowledge-qa"
version = "0.1.0"
description = "RAG Knowledge QA with Qdrant hybrid retrieval"
requires-python = ">=3.9"
dependencies = [
    "langchain-text-splitters>=0.3",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "pymupdf>=1.25",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "ollama>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
rag = "src.main:app"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
